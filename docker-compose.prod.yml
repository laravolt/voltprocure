# VoltProcure production demo: Laravel Octane on FrankenPHP (worker mode).
#
#   cp .env.docker.example .env.docker   # then set APP_KEY and APP_URL
#   docker compose -f docker-compose.prod.yml up -d --build
#   open http://localhost:8090
#
# One image, two roles: `app` serves HTTP, `scheduler` runs the nightly demo
# reset. The host port binds to 127.0.0.1 so a reverse proxy can sit in front.

x-app: &app
  build:
    context: .
    dockerfile: docker/frankenphp/prod.Dockerfile
  image: voltprocure:prod
  env_file: .env.docker
  environment:
    DB_JOURNAL_MODE: wal
    DB_SYNCHRONOUS: normal
    DB_BUSY_TIMEOUT: 5000
    DB_TRANSACTION_MODE: IMMEDIATE
  volumes:
    - voltprocure-database:/app/database/data
    - voltprocure-storage:/app/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${VOLTPROCURE_PORT:-8090}:8080"

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  voltprocure-database:
  voltprocure-storage:
