name: docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -f docker/frankenphp/prod.Dockerfile -t voltprocure:ci .

      - name: Start the container
        run: |
          key="base64:$(openssl rand -base64 32)"
          docker run -d --name app -p 8090:8080 \
            -e APP_KEY="$key" -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=http://127.0.0.1:8090 \
            -e APP_DEMO=true -e SESSION_DRIVER=cookie -e CACHE_STORE=file -e OCTANE_WORKERS=2 \
            voltprocure:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8090/up && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8090/up

      - name: Log in and open every page twice
        run: |
          jar=$(mktemp)
          base=http://127.0.0.1:8090
          token=$(curl -s -c "$jar" -b "$jar" "$base/auth/login" | grep -o '<input[^>]*_token[^>]*>' | grep -o 'value="[^"]*"' | head -1 | cut -d'"' -f2)
          [ -n "$token" ] || { echo "no CSRF token on the login page"; exit 1; }
          curl -s -o /dev/null -c "$jar" -b "$jar" -X POST "$base/auth/login" \
            --data-urlencode "_token=$token" --data-urlencode "email=andi@voltprocure.test" --data-urlencode "password=password"
          # Twice: the second request is the one that used to fail under Octane with a persistent cache.
          for round in 1 2; do
            for path in /home /purchase-requests /purchase-orders /items /suppliers; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" "$base$path")
              echo "round $round $path $code"
              [ "$code" = "200" ] || exit 1
            done
          done

      - name: Capture screenshots
        run: |
          cd .github/screenshots
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.59.1
          npx playwright install --with-deps chromium
          APP_URL=http://127.0.0.1:8090 node capture.mjs "$GITHUB_WORKSPACE/screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -100
