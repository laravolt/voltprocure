name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          # `composer test` tidak mengukur coverage (test:unit --no-coverage);
          # xdebug hanya memperlambat semua fase 2-3x. test:coverage memaksa
          # XDEBUG_MODE sendiri bila suatu saat dijalankan di CI — saat itu
          # ganti ke `coverage: pcov` sekalian.
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      - name: Cache Rector
        uses: actions/cache@v4
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create Cache Directories
        run: mkdir -p /tmp/rector /tmp/phpstan

      - name: Laravolt Things
        run: php artisan laravolt:link

      - name: Tests
        run: composer test

      # Suite Browser berjalan terpisah agar toolchain Playwright tidak
      # memperlambat quality gate PHP yang cepat.
  browser:
    name: Critical Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Configure Application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan laravolt:link

      - name: Build Assets
        run: bun run build

      - name: Run Critical Browser Tests
        run: composer test:browser:critical

      - name: Upload Browser Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: |
            tests/.pest/
            tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: ci
    # Hanya jalan bila di-opt-in lewat repo variable SONAR_ENABLED=true —
    # tanpa secret SONAR_TOKEN scan selalu gagal dan setiap PR merah.
    if: success() && vars.SONAR_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # Job ci tidak lagi mengunggah coverage (tidak pernah terisi);
      # Sonar berjalan tanpa metrik coverage sampai test:coverage diaktifkan.

      - name: Verify Config
        run: |
          echo "Checking for properties file..."
          if [ -f sonar-project.properties ]; then
            ls -la sonar-project.properties
            echo "Content of sonar-project.properties:"
            cat sonar-project.properties
          else
            echo "ERROR: sonar-project.properties FILE MISSING!"
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
