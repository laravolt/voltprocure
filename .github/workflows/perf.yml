name: perf

# Throughput and CPU profile of the main pages. Run it by hand, or push to a
# perf/** branch to compare a change against main. Results land in the job
# summary; the profile job also uploads speedscope files (open them at
# https://www.speedscope.app).

on:
  workflow_dispatch:
  push:
    branches:
      - perf/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1
      APP_DEMO: "true"
      APP_FORCE_HTTPS: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/data/perf.sqlite
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      OCTANE_SERVER: frankenphp

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none
          extensions: excimer
          # Same OPcache settings as the production image.
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M, opcache.validate_timestamps=0, memory_limit=512M

      - uses: oven-sh/setup-bun@v2

      - name: Install the app as the production image does
        run: |
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress
          composer dump-autoload --classmap-authoritative --no-dev
          bun install --frozen-lockfile
          bun run build
          php artisan package:discover --ansi
          php artisan laravolt:extract-assets --no-interaction
          php artisan laravolt:link --no-interaction
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"

      - name: Seed the demo data and cache the bootstrap
        run: |
          mkdir -p database/data
          touch "$DB_DATABASE"
          php artisan migrate --force --seed --no-interaction
          php artisan optimize --no-interaction

      - name: Profile
        run: php scripts/perf/profile.php 200 perf-profile

      - uses: actions/upload-artifact@v7
        with:
          name: perf-profile
          path: perf-profile

  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install wrk
        run: sudo apt-get update -q && sudo apt-get install -yq wrk

      - name: Build the production image
        run: docker build -f docker/frankenphp/prod.Dockerfile -t voltprocure:perf .

      - name: Measure with 2 and 4 Octane workers
        run: |
          key="base64:$(openssl rand -base64 32)"
          echo "Runner: $(nproc) vCPU, $(free -m | awk '/^Mem:/ {print $2}') MB" >> "$GITHUB_STEP_SUMMARY"
          for workers in 2 4; do
            docker run -d --name app -p 8090:8080 \
              -e APP_KEY="$key" -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=http://127.0.0.1:8090 \
              -e APP_DEMO=true -e APP_FORCE_HTTPS=false -e SESSION_DRIVER=cookie -e CACHE_STORE=file \
              -e OCTANE_WORKERS="$workers" \
              voltprocure:perf
            for i in $(seq 1 60); do
              curl -sf -o /dev/null http://127.0.0.1:8090/up && break
              sleep 2
            done
            scripts/perf/load.sh http://127.0.0.1:8090 15s 8 "$workers Octane workers"
            docker rm -f app > /dev/null
          done

      - name: Container state and logs
        if: failure()
        run: |
          docker inspect app --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' || true
          docker logs app 2>&1 | tail -100
