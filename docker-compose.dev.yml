# VoltProcure — development stack.
# Pulls laravoltdev/image:php8.5-dev (FrankenPHP + Laravolt extensions + Bun + Xdebug); nothing is built locally.
#
# Run:
#   docker compose -f docker-compose.dev.yml up -d
# Then open http://localhost:8080 ; Vite dev server on http://localhost:5173.

services:
  app:
    image: laravoltdev/image:php8.5-dev
    container_name: laravolt-dev
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVOLT_LINK: "true"
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache

volumes:
  composer-cache:
